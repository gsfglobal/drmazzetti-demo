name: Pubblica demo Mazzetti

on:
  push:
    branches: [main]
    paths:
      - "mazzetti-demo.zip"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Estrai il progetto dalla demo
        shell: bash
        run: |
          test -f mazzetti-demo.zip || { echo "::error::Manca mazzetti-demo.zip nella radice del repository"; exit 1; }
          mkdir -p source
          unzip -q mazzetti-demo.zip -d source
          test -f source/mazzetti-demo/package-lock.json
          test -f source/mazzetti-demo/next.config.ts

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Adatta URL pubblico al repository attuale
        working-directory: source/mazzetti-demo
        run: |
          sed -i 's|https://gsfglobal.github.io/mazzetti-demo|https://gsfglobal.github.io/drmazzetti-demo|g' src/content/site.ts

      - name: Installa le dipendenze
        working-directory: source/mazzetti-demo
        run: npm ci --no-audit --no-fund

      - name: Genera il sito statico
        working-directory: source/mazzetti-demo
        env:
          BASE_PATH: /drmazzetti-demo
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run build
          test -f out/index.html
          touch out/.nojekyll

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepara i file per GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: source/mazzetti-demo/out

      - name: Pubblica sito
        id: deployment
        uses: actions/deploy-pages@v4
